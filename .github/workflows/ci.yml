name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly the lockfile, so CI cannot drift from a
      # developer's tree by silently resolving a newer dependency.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile runs typecheck as part of `npm run build`, so this also
      # proves the shipped artifact compiles rather than only the source tree.
      - name: Build image
        run: docker build -t artha-web:${{ github.sha }} .
