# Continuous integration and delivery.
#
# One developer pushes to main; every push that passes is published to GHCR
# and deployed to the one host, where the platform repository's compose file
# runs it, and a run by hand does the same.

name: CI

on:
  push:
    branches: [main]
  # A deploy by hand: the first boot of a new host, or a redeploy of what
  # main already holds. Runs the whole pipeline, so nothing unverified ships.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Format, lint, types, coverage, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly the lockfile, so CI cannot drift from a
      # developer's tree by silently resolving a newer dependency.
      - run: npm ci

      # Each check is a separate step so a failure names itself in the UI,
      # but every one is a script a developer runs locally.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Coverage thresholds
        run: npm run coverage

      - name: Dependency audit
        # High and critical only. Moderate advisories in the test toolchain
        # never reach the browser, and blocking on them trains people to
        # ignore the audit.
        run: npm run audit

  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile runs typecheck as part of `npm run build`, so this also
      # proves the shipped artifact compiles, not only the source tree.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the host
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://arthascience.com
    steps:
      - name: Load the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          fi

      - name: Log the host in to GHCR and deploy
        # The workflow's own token, piped over SSH, logs the host's Docker in
        # for as long as this run lives: the pull happens now, restarts use
        # the images already on disk, and no long-lived registry token ever
        # sits on the host. deploy.sh lives on the host, in the checked-out
        # platform repository, so the steps a deploy takes are versioned.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null \
             && /opt/artha/deploy/deploy.sh web ${{ github.sha }}"
